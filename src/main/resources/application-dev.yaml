spring:
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      host: localhost
      port: 27017
      database: { database_name }
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: { username }
    password: { gmail_app_password }
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8090
  servlet:
    context-path: /journal/api/v1

logging:
  level:
    root: INFO

weather:
  api:
    key: { weather_api_key }